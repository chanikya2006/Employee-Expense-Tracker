<mat-drawer-container
  class="manager-container"
  hasBackdrop="true"
  autosize
>

  <!-- ========================================= -->
  <!-- SIDEBAR / POPUP DRAWER -->
  <!-- ========================================= -->

  <mat-drawer
    #drawer
    class="manager-sidenav"
    mode="over"
  >

    <!-- BRAND -->
    <div class="sidenav-brand">

      <div class="brand-icon">
        <mat-icon>account_balance</mat-icon>
      </div>

      <div class="brand-text">

        <div class="brand-title">
          Expense Tracker
        </div>

        <div class="brand-subtitle">
          Manage • Track • Optimize
        </div>

      </div>

    </div>


    <!-- ========================================= -->
    <!-- NAVIGATION -->
    <!-- ========================================= -->

    <div class="sidenav-section">

      <div class="section-title">
        NAVIGATION
      </div>


      <!-- DASHBOARD -->

      <button
        mat-button
        class="sidenav-item"
        [class.active]="isActive('/dashboard')"
        (click)="onDashboard(); drawer.close()"
      >

        <mat-icon>
          dashboard
        </mat-icon>

        <span>
          Dashboard
        </span>

      </button>


      <!-- ADD EMPLOYEE -->

      <button
        mat-button
        class="sidenav-item"
        [class.active]="isActive('/add-employee')"
        (click)="onAddEmployee(); drawer.close()"
      >

        <mat-icon>
          person_add
        </mat-icon>

        <span>
          Add Employee
        </span>

      </button>


      <!-- EMPLOYEES -->

      <button
        mat-button
        class="sidenav-item"
        [class.active]="isActive('/employees')"
        (click)="onEmployees(); drawer.close()"
      >

        <mat-icon>
          groups
        </mat-icon>

        <span>
          Employees
        </span>

      </button>


      <!-- EMPLOYEE EXPENSES -->

      <button
        mat-button
        class="sidenav-item"
        [class.active]="isActive('/employee-expenses')"
        (click)="onEmployeeExpenses(); drawer.close()"
      >

        <mat-icon>
          payments
        </mat-icon>

        <span>
          Employee Expenses
        </span>

      </button>

    </div>


    <!-- ========================================= -->
    <!-- ACCOUNT -->
    <!-- ========================================= -->

    <div class="sidenav-account">

      <div class="section-title">
        ACCOUNT
      </div>


      <!-- PROFILE -->

      <button
        mat-button
        class="sidenav-item"
        [class.active]="isActive('/profile')"
        (click)="onProfile(); drawer.close()"
      >

        <mat-icon>
          person
        </mat-icon>

        <span>
          Profile
        </span>

      </button>


      <!-- LOGOUT -->

      <button
        mat-button
        class="sidenav-item logout-item"
        (click)="onLogout()"
      >

        <mat-icon>
          logout
        </mat-icon>

        <span>
          Logout
        </span>

      </button>

    </div>


    <!-- ========================================= -->
    <!-- SIDEBAR FOOTER -->
    <!-- ========================================= -->

    <div class="sidenav-footer">

      <div class="footer-brand">

        <div class="footer-icon">

          <mat-icon>
            account_balance
          </mat-icon>

        </div>

        <div>

          <div class="footer-title">
            Expense Tracker
          </div>

          <div class="footer-subtitle">
            © 2026 All rights reserved.
          </div>

        </div>

      </div>


      <!-- ========================================= -->
      <!-- SOCIAL LINKS -->
      <!-- ========================================= -->

      <div class="social-links">


        <!-- GITHUB -->

        <a
          href="https://github.com/chanikya2006"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="GitHub"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M12 2C6.48 2 2 6.58 2 12.26c0 4.53 2.87 8.37 6.84 9.72.5.1.68-.22.68-.49v-1.7c-2.78.62-3.37-1.38-3.37-1.38-.46-1.2-1.11-1.52-1.11-1.52-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.59 2.35 1.13 2.92.86.09-.67.35-1.13.64-1.39-2.22-.26-4.55-1.15-4.55-5.08 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.7 0 0 .84-.28 2.75 1.05A9.2 9.2 0 0 1 12 7.16c.85 0 1.7.12 2.5.35 1.9-1.33 2.74-1.05 2.74-1.05.55 1.4.2 2.44.1 2.7.64.72 1.03 1.63 1.03 2.75 0 3.94-2.33 4.81-4.56 5.07.36.32.68.94.68 1.9v2.82c0 .27.18.59.69.49A10.28 10.28 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"
            />

          </svg>

        </a>


        <!-- LINKEDIN -->

        <a
          href="https://www.linkedin.com/in/chanikya-ganteda-73bb9329a"
          target="_blank"
          rel="noopener noreferrer"
          class="social-link"
          aria-label="LinkedIn"
        >

          <svg
            viewBox="0 0 24 24"
            aria-hidden="true"
          >

            <path
              d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.61 0 4.28 2.38 4.28 5.48v6.26zM5.32 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM3.54 20.45H7.1V9H3.54v11.45z"
            />

          </svg>

        </a>

      </div>

    </div>

  </mat-drawer>


  <!-- ========================================= -->
  <!-- MAIN APPLICATION -->
  <!-- ========================================= -->

  <div class="manager-content">


    <!-- ========================================= -->
    <!-- TOP BAR -->
    <!-- ========================================= -->

    <mat-toolbar class="manager-toolbar">


      <!-- HAMBURGER -->

      <button
        mat-icon-button
        class="menu-button"
        (click)="drawer.toggle()"
        aria-label="Open navigation menu"
      >

        <mat-icon>
          menu
        </mat-icon>

      </button>


      <!-- TITLE -->

      <span class="app-title">
        Expense Tracker
      </span>


      <span class="toolbar-spacer"></span>


      <!-- LOGOUT -->

      <button
        mat-raised-button
        color="accent"
        class="toolbar-logout"
        (click)="onLogout()"
      >

        <mat-icon>
          logout
        </mat-icon>

        <span>
          Logout
        </span>

      </button>

    </mat-toolbar>


    <!-- ========================================= -->
    <!-- CURRENT PAGE -->
    <!-- ========================================= -->

    <main class="page-content">

      <router-outlet></router-outlet>

    </main>

  </div>

</mat-drawer-container>
